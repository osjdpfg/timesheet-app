name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE (ONEDIR)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name TimesheetApp --clean main.py

      - name: Zip Artifact
        run: |
          cd dist
          powershell Compress-Archive -Path TimesheetApp -DestinationPath TimesheetApp-Windows.zip

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: TimesheetApp-Windows
          path: dist/TimesheetApp-Windows.zip
